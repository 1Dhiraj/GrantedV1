# The check this repository can actually pass.
#
# The 94 inherited workflows are upstream's: paid runners, organisation
# variables, dozens of secrets, and `ci.yml` branching on
# `github.repository == 'openclaw/openclaw'` to pick where it runs. On this fork
# they failed within seconds of every push until their triggers were removed.
#
# This one needs nothing that is not in the repository: a stock runner, the
# pinned pnpm from package.json, and three commands that already pass locally.
# A check that can fail for a real reason is worth more than ninety-four that
# always fail for the same irrelevant one.
#
# Deliberately not here: the 23-task capability suite. It drives a live gateway
# against a real model, so it needs credentials and a running agent. That belongs
# on a machine with both, not on a CI runner that would have to be handed keys.
name: Granted CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push supersedes the first; no value in finishing a run for a commit
# nobody is waiting on any more.
concurrency:
  group: granted-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck + lint
    runs-on: ubuntu-24.04
    # Install is the slow part: 181 workspace projects, ~2.9 GB resolved. The
    # cap is generous so a cold cache is a slow run, not a red one.
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # corepack honours the `packageManager` pin in package.json, so CI uses the
      # same pnpm as the lockfile was written with rather than whatever is newest.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      # --frozen-lockfile so a drifted lockfile fails here rather than silently
      # resolving to versions nobody tested.
      - name: Install
        run: pnpm install --frozen-lockfile

      # tsgo, not tsc: this tree is ~24k TypeScript files and tsc exhausts its
      # heap and aborts partway, reporting zero errors as it dies - which reads
      # exactly like a pass.
      - name: Typecheck core
        run: pnpm tsgo:core

      - name: Typecheck extensions
        run: pnpm tsgo:extensions

      # `pnpm lint` is deliberately absent until it passes on main. It currently
      # reports 11 pre-existing errors - three files over the 700-line cap, a
      # shadowed `dirname`, a few typescript-eslint nits - none introduced by
      # this workflow's author and none a one-line fix, since the max-lines ones
      # need files split.
      #
      # Adding it now would make this red from its first run, which is the exact
      # failure this workflow exists to stop: a check that always fails teaches
      # you to ignore mail from your own repository. It goes in the step it
      # belongs in the moment those 11 are cleared.
